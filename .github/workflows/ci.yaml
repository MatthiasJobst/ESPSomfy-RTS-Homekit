name: ESPSomfy-RTS

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  IDF_VERSION: "v5.5.3"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ESP32-S3 (ESP-IDF)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      # Builds the firmware and (via the POST_BUILD step in CMakeLists.txt) the
      # LittleFS image; compiling both is the CI signal. The binaries themselves
      # are not uploaded here — release.yaml publishes the release artifacts.
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          command: idf.py build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build gcovr

      - name: Configure
        run: cmake -S test/unit -B test/unit/build -G Ninja

      - name: Build
        run: cmake --build test/unit/build

      - name: Run tests
        run: ctest --test-dir test/unit/build --output-on-failure

      - name: Generate coverage report
        run: |
          mkdir -p test/unit/build/coverage
          gcovr \
            --root ${{ github.workspace }} \
            --filter 'main/somfy/' \
            --exclude 'main/somfy/SomfyRoom\.cpp' \
            --exclude 'main/somfy/SomfyRoom\.h' \
            --exclude 'main/somfy/SomfyGroup\.cpp' \
            --exclude 'main/somfy/SomfyGroup\.h' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details test/unit/build/coverage/index.html \
            test/unit/build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: test/unit/build/coverage/
