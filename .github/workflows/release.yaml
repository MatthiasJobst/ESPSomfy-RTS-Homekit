name: ESPSomfy-RTS Release

on:
  release:
    types: [published]

env:
  IDF_VERSION: "v5.5.3"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ESP32-S3 (ESP-IDF)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build

      - name: Copy firmware binary
        run: cp build/SomfyController.bin SomfyController.esp32s3.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: SomfyController.esp32s3.bin
          retention-days: 5

      # The IDF build generates the LittleFS image (build/spiffs.bin) and mirrors
      # it to SomfyController.littlefs.bin via the POST_BUILD step in CMakeLists.txt.
      - name: Copy LittleFS image
        run: cp build/SomfyController.littlefs.bin SomfyController.littlefs.bin

      - name: Upload LittleFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: littlefs
          path: SomfyController.littlefs.bin
          retention-days: 5

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build gcovr

      - name: Configure
        run: cmake -S test/unit -B test/unit/build -G Ninja

      - name: Build
        run: cmake --build test/unit/build

      - name: Run tests
        run: ctest --test-dir test/unit/build --output-on-failure

      - name: Generate coverage report
        run: |
          mkdir -p test/unit/build/coverage
          gcovr \
            --root ${{ github.workspace }} \
            --filter 'main/somfy/' \
            --exclude 'main/somfy/SomfyRoom\.cpp' \
            --exclude 'main/somfy/SomfyRoom\.h' \
            --exclude 'main/somfy/SomfyGroup\.cpp' \
            --exclude 'main/somfy/SomfyGroup\.h' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details test/unit/build/coverage/index.html \
            test/unit/build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: test/unit/build/coverage/

  build-esp32:
    name: Build ESP32 (ESP-IDF)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32
          command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.esp32;sdkconfig.release" build

      - name: Copy firmware binary
        run: cp build/SomfyController.bin SomfyController.esp32.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: SomfyController.esp32.bin
          retention-days: 5

      # The IDF build generates the LittleFS image (build/spiffs.bin) sized from
      # the 4MB partition table and mirrors it to SomfyController.littlefs.bin.
      - name: Copy LittleFS image
        run: cp build/SomfyController.littlefs.bin SomfyController.littlefs.esp32.bin

      - name: Upload LittleFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: littlefs-esp32
          path: SomfyController.littlefs.esp32.bin
          retention-days: 5

  release:
    name: Upload release assets
    needs: [build, build-esp32, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware (ESP32-S3)
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3

      - name: Download firmware (ESP32)
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32

      - name: Download LittleFS (ESP32-S3)
        uses: actions/download-artifact@v4
        with:
          name: littlefs

      - name: Download LittleFS (ESP32)
        uses: actions/download-artifact@v4
        with:
          name: littlefs-esp32

      - name: Upload ESP32-S3 firmware to release
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ github.event.release.upload_url }}
          asset_name: SomfyController.esp32s3.bin
          asset_path: SomfyController.esp32s3.bin
          overwrite: true

      - name: Upload ESP32-S3 LittleFS to release
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ github.event.release.upload_url }}
          asset_name: SomfyController.littlefs.bin
          asset_path: SomfyController.littlefs.bin
          overwrite: true

      - name: Upload ESP32 firmware to release
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ github.event.release.upload_url }}
          asset_name: SomfyController.esp32.bin
          asset_path: SomfyController.esp32.bin
          overwrite: true

      - name: Upload ESP32 LittleFS to release
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ github.event.release.upload_url }}
          asset_name: SomfyController.littlefs.esp32.bin
          asset_path: SomfyController.littlefs.esp32.bin
          overwrite: true
